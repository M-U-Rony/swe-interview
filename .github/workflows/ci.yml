name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js app
        env:
          MONGODB_URL: mongodb://localhost:27017/swe-interview
          JWT_SECRET: ci-build-placeholder-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ELEVENLABS_API_KEY: ci-placeholder
          ELEVENLABS_AGENT_ID: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: swe-interview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
